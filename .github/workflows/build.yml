name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TaskScheduleTable/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build-win-x64:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\TaskScheduleTable\TaskScheduleTable.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -o .\publish\win-x64

      - name: Verify
        shell: pwsh
        run: |
          $exe = Get-Item '.\publish\win-x64\タスク_予定表.exe'
          if ($exe.Length -lt 1000000) { throw 'EXE size validation failed.' }
          Write-Host ('EXE: ' + $exe.FullName)
          Write-Host ('SIZE: ' + $exe.Length)
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Package ready-to-run zip
        shell: pwsh
        run: |
          Remove-Item .\package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\package\TaskScheduleTable_v1.10\Voice | Out-Null

          Copy-Item .\publish\win-x64\タスク_予定表.exe .\package\TaskScheduleTable_v1.10\タスク_予定表.exe -Force
          Copy-Item .\TaskScheduleTable\Voice\README.md .\package\TaskScheduleTable_v1.10\Voice\README.md -Force

          @'
          タスク_予定表 v1.10

          使い方:
          1. ZIPを展開
          2. タスク_予定表.exe をダブルクリック

          SDK、CMD、ビルド操作は不要です。

          Voice:
          Voiceフォルダーに対応するWAVを入れると音声通知を使用できます。
          '@ | Set-Content .\package\TaskScheduleTable_v1.10\README.txt -Encoding UTF8

          New-Item -ItemType Directory -Force -Path .\download | Out-Null
          Compress-Archive -Path .\package\TaskScheduleTable_v1.10 -DestinationPath .\download\TaskScheduleTable_v1.10_READY.zip -Force

      - name: Commit ready-to-run zip
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .\download\TaskScheduleTable_v1.10_READY.zip

          if (git diff --cached --quiet) {
            Write-Host "READY package unchanged."
            exit 0
          }

          git commit -m "build: update v1.10 ready package"
          git push origin HEAD:main
