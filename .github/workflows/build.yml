name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TaskScheduleTable/**'
      - 'updater/**'
      - '.gitattributes'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: task-schedule-main-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-win-x64:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\TaskScheduleTable\TaskScheduleTable.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -o .\publish\win-x64

      - name: Build native GUI updater
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\publish\updater | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools were not found.' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $root = (Get-Location).Path
          $cmd = '"{0}" -arch=x64 -host_arch=x64 && cd /d "{1}\updater" && rc /nologo /fo "{1}\publish\updater\TaskScheduleTableUpdater.res" TaskScheduleTableUpdater.rc && cl /nologo /std:c++17 /EHsc /O2 /DUNICODE /D_UNICODE /utf-8 TaskScheduleTableUpdater.cpp "{1}\publish\updater\TaskScheduleTableUpdater.res" user32.lib comdlg32.lib shell32.lib advapi32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS /OUT:"{1}\publish\updater\タスク_予定表_Updater.exe"' -f $devcmd, $root
          cmd /c $cmd
          $updater = Get-Item '.\publish\updater\タスク_予定表_Updater.exe'
          if ($updater.Length -gt 5000000) { throw ('Updater is unexpectedly large: ' + $updater.Length) }
          Write-Host ('UPDATER SIZE: ' + $updater.Length)

      - name: Verify
        shell: pwsh
        run: |
          $exe = Get-Item '.\publish\win-x64\タスク_予定表.exe'
          if ($exe.Length -lt 1000000) { throw 'EXE size validation failed.' }
          Write-Host ('EXE: ' + $exe.FullName)
          Write-Host ('SIZE: ' + $exe.Length)
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Package ready-to-run zip
        shell: pwsh
        run: |
          Remove-Item .\package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\package\TaskScheduleTable_v2.6\Voice | Out-Null

          Copy-Item .\publish\win-x64\タスク_予定表.exe .\package\TaskScheduleTable_v2.6\タスク_予定表.exe -Force
          Copy-Item .\TaskScheduleTable\Assets\TaskScheduleTable.ico .\package\TaskScheduleTable_v2.6\TaskScheduleTable.ico -Force
          Copy-Item .\TaskScheduleTable\Voice\README.md .\package\TaskScheduleTable_v2.6\Voice\README.md -Force
          Copy-Item .\TaskScheduleTable\Voice\*.wav .\package\TaskScheduleTable_v2.6\Voice\ -Force

          @'
          タスク_予定表 v2.6

          使い方:
          1. ZIPを展開
          2. タスク_予定表.exe をダブルクリック

          SDK、CMD、ビルド操作は不要です。

          Voice:
          VOICE一式を同梱しています。音量はアプリ内のVOICEメニューで0～100%に調整できます。
          '@ | Set-Content .\package\TaskScheduleTable_v2.6\README.txt -Encoding UTF8

          New-Item -ItemType Directory -Force -Path .\download | Out-Null
          Compress-Archive -Path .\package\TaskScheduleTable_v2.6 -DestinationPath .\download\TaskScheduleTable_v2.6_READY.zip -Force

          Remove-Item .\update-package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\update-package\TaskScheduleTable_Update_to_v2.6\UpdateFiles\Voice | Out-Null

          Copy-Item .\publish\updater\タスク_予定表_Updater.exe .\update-package\TaskScheduleTable_Update_to_v2.6\タスク_予定表_Updater.exe -Force
          Copy-Item .\publish\win-x64\タスク_予定表.exe .\update-package\TaskScheduleTable_Update_to_v2.6\UpdateFiles\タスク_予定表.exe -Force
          Copy-Item .\TaskScheduleTable\Assets\TaskScheduleTable.ico .\update-package\TaskScheduleTable_Update_to_v2.6\UpdateFiles\TaskScheduleTable.ico -Force
          Copy-Item .\TaskScheduleTable\Voice\*.wav .\update-package\TaskScheduleTable_Update_to_v2.6\UpdateFiles\Voice\ -Force

          @'
          タスク_予定表 v2.6 更新用

          1. ZIPを展開してください。
          2. タスク_予定表_Updater.exe を起動してください。
          3. 旧版EXEが自動検出されない場合は「参照...」から選択してください。
          4. 「アップデート」を押してください。

          更新前EXEは Backup_PreUpdate\日時 フォルダへバックアップされます。
          タスクや設定データは削除されません。

          更新対象:
          - タスク_予定表.exe
          - Voice フォルダ
          - TaskScheduleTable.ico
          '@ | Set-Content .\update-package\TaskScheduleTable_Update_to_v2.6\README_更新方法.txt -Encoding UTF8

          Compress-Archive -Path .\update-package\TaskScheduleTable_Update_to_v2.6 -DestinationPath .\download\TaskScheduleTable_Update_to_v2.6.zip -Force

      - name: Verify release package
        shell: pwsh
        run: |
          Remove-Item .\verify-release -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive .\download\TaskScheduleTable_v2.6_READY.zip .\verify-release -Force
          $root = Get-ChildItem .\verify-release -Directory | Select-Object -First 1
          $exe = Join-Path $root.FullName 'タスク_予定表.exe'
          if (-not (Test-Path $exe)) { throw 'Release EXE is missing.' }
          $icon = Join-Path $root.FullName 'TaskScheduleTable.ico'
          $voices = @(Get-ChildItem (Join-Path $root.FullName 'Voice') -Filter '*.wav' -File)
          if (-not (Test-Path $icon)) { throw 'Release icon is missing.' }
          if ($voices.Count -ne 22) { throw ('VOICE count validation failed: ' + $voices.Count) }
          Write-Host ('RELEASE EXE: ' + $exe)
          Write-Host ('VOICE COUNT: ' + $voices.Count)

          Remove-Item .\verify-update -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive .\download\TaskScheduleTable_Update_to_v2.6.zip .\verify-update -Force
          $updateRoot = Get-ChildItem .\verify-update -Directory | Select-Object -First 1
          $updaterExe = Join-Path $updateRoot.FullName 'タスク_予定表_Updater.exe'
          $payloadExe = Join-Path $updateRoot.FullName 'UpdateFiles\タスク_予定表.exe'
          $payloadIcon = Join-Path $updateRoot.FullName 'UpdateFiles\TaskScheduleTable.ico'
          $payloadVoices = @(Get-ChildItem (Join-Path $updateRoot.FullName 'UpdateFiles\Voice') -Filter '*.wav' -File)
          if (-not (Test-Path $updaterExe)) { throw 'Updater EXE is missing.' }
          $updaterSize = (Get-Item $updaterExe).Length
          if ($updaterSize -lt 50000 -or $updaterSize -gt 5000000) { throw ('Updater EXE size validation failed: ' + $updaterSize) }
          if (-not (Test-Path $payloadExe)) { throw 'Updater payload EXE is missing.' }
          if (-not (Test-Path $payloadIcon)) { throw 'Updater icon payload is missing.' }
          if ($payloadVoices.Count -ne 22) { throw ('Updater VOICE count validation failed: ' + $payloadVoices.Count) }
          Write-Host ('UPDATER EXE: ' + $updaterExe)
          Write-Host ('UPDATER VOICE COUNT: ' + $payloadVoices.Count)

      - name: Commit ready-to-run zip
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .\download\TaskScheduleTable_v2.6_READY.zip
          git add -f .\download\TaskScheduleTable_Update_to_v2.6.zip

          if (git diff --cached --quiet) {
            Write-Host "v2.6 package unchanged."
            exit 0
          }

          git commit -m "build: update v2.6 ready package"
          git pull --rebase origin main
          git push origin HEAD:main
