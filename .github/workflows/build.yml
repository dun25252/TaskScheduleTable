name: build

on:
  push:
    branches: [ main ]
    paths:
      - 'TaskScheduleTable/**'
      - 'BUILD_v1.8.cmd'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\TaskScheduleTable\TaskScheduleTable.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -o .\publish\win-x64
      - name: Verify
        shell: pwsh
        run: |
          $exe = Get-Item '.\publish\win-x64\タスク_予定表.exe'
          Write-Host ('EXE: ' + $exe.FullName)
          Write-Host ('SIZE: ' + $exe.Length)
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
